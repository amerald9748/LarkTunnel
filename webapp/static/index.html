<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LarkTunnel · 库存查询</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🚇 <b>LarkTunnel</b> <span>库存查询</span></div>
    <div class="hint">柜号 / ISA → 3.1 实时查询 · <span id="tzNote">—</span></div>
  </header>

  <main class="wrap">
    <section class="panel controls">
      <div class="grid">
        <label class="fld">
          <span>表</span>
          <select id="tableSel"></select>
        </label>

        <label class="fld grow">
          <span>视图 <em id="viewCount"></em></span>
          <div class="viewpick">
            <input id="viewFilter" type="text" placeholder="输入关键字过滤 107 个视图…" autocomplete="off" />
            <select id="viewSel"></select>
          </div>
        </label>
      </div>

      <div class="grid">
        <label class="fld">
          <span>查询字段</span>
          <div class="seg" id="fieldSeg">
            <button data-k="awb" class="on">柜号/AWB</button>
            <button data-k="isa">ISA</button>
          </div>
        </label>

        <label class="fld">
          <span>匹配方式</span>
          <div class="seg" id="modeSeg">
            <button data-m="contains" class="on">包含</button>
            <button data-m="is">精确</button>
          </div>
        </label>

        <label class="fld grow">
          <span id="valLabel">柜号</span>
          <input id="valInput" type="text" placeholder="例如 CAJU5283296" autocomplete="off" />
        </label>

        <div class="fld go">
          <span>&nbsp;</span>
          <button id="goBtn" class="primary">查询</button>
        </div>
      </div>
      <div class="tip" id="modeTip"></div>
    </section>

    <section class="panel upload">
      <div class="uphead">
        <b>📄 上传文件自动识别</b>
        <span>从 Excel / CSV 中自动提取 柜号 · 批次号 · 仓库供应商 · 目的地路线 · 预约时间 · ISA（缺失返回 <code>Null</code>）</span>
      </div>
      <div id="drop" class="drop">
        <input id="fileInput" type="file" accept=".xlsx,.xlsm,.csv,.tsv,.txt" hidden />
        <div class="dropinner">
          <span class="big">把文件拖到这里</span>
          <span class="or">或</span>
          <button id="pickBtn" class="primary">选择文件</button>
          <span class="fmt">支持 .xlsx / .xlsm / .csv / .tsv / .txt</span>
        </div>
      </div>
      <div id="parseOut" class="parseout" hidden></div>
    </section>

    <section id="status" class="status" hidden></section>
    <section id="results" class="results"></section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
